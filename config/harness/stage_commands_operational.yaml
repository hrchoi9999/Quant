    command: null
    working_dir: "D:/QuantAnalysis"
    safe_run: false
    risk_level: medium
    command_status: "manual_prompt_only"
    confidence: "none"
    expected_artifacts: []
    notes: "prompt 범위는 D:/Quant/venv64/Scripts/python.exe D:/QuantAnalysis/portfolio_pipeline.py --asof <target_asof> 실행, 기본 GCS publish 결과 확인, 운영 리뷰, selection history/top10/top3/benchmark-relative/model attribution 기반 포트폴리오 성과 점검과 개선 후보 보고다. 정책 변경/비중 변경/모델 제외 확정은 하지 않는다. command harness 직접 실행 후보에서는 제외하고 prompt gate로만 운영한다."

  WD06_PRE_GCS_PUBLISH:
