prompt_handoff:
  mode: "manual_prompt_handoff"
  primary_orchestration: "prompt_handoff"
  command_harness_role: "diagnostic_only"
  direct_execution_allowed: false
  auto_thread_control_allowed: false
  weekday_weekend_combined_run_forbidden: true
  auto_repeat_allowed: false
  operating_model_version: "Quant 1.0"
  excluded_model_versions:
    - "Quant 1.1"
    - "Quant 1.2"
    - "Quant 2.x"
  allowed_non_operating_observations:
    - "Quant 1.2 frozen live-shadow read-only comparison"
  model_version_boundary: "Quant 1.0 operating scope only. Quant 1.2 is excluded from operation/publish and is allowed only as a frozen live-shadow read-only governance comparison. Quant 1.1/2.x research, shadow, handoff, payload, validation, promotion, and publish require a separate explicit user instruction."
  default_timebox_minutes: 10
  report_quality_gate:
    enabled: true
    base_required_fields:
      - "stage_id"
      - "status"
      - "asof"
      - "evidence_files"
      - "known_issues"
      - "handoff_to_next"

  cycles:
    weekday:
      stages:
        - WD01_QUANT_FRONT
        - WD02_MARKET_COLLECT
        - WD03_MARKET_ANALYSIS
        - WD04_QUANT_REAR
        - WD05_PORTFOLIO_ANALYSIS
        - WD06_PRE_GCS_PUBLISH
        - WD07_HARNESS_CLOSE
    weekend:
      stages:
        - WE01_QUANT_WEEKEND_PIPELINE
        - WE06_HARNESS_CLOSE

  stages:
    WD01_QUANT_FRONT:
      thread: "Quant"
      title: "주중 Quant 전반부 업데이트"
      objective: "평소 직접 지시 수준의 주중 전반부 stock/ETF 데이터 refresh와 freshness 확인만 수행한다. 공식 표준인 `run_daily_quant_pipeline.py --asof <target_asof> --include-etf --data-refresh-only` 또는 동등한 전반부 체인을 사용한다. full model run, research_full, 정책 변경, public publish 확정은 하지 않는다."
      required_checks:
        - "WD01의 표준 직접 지시 범위는 `run_daily_quant_pipeline.py --asof <target_asof> --include-etf --data-refresh-only` 또는 동등한 단일 전반부 체인이다. `--include-etf`를 생략하지 않는다."
        - "QuantMarket market context mart가 참조하는 ETF proxy 가격을 포함해 ETF 일별 가격 DB의 latest asof가 target_asof인지 확인한다. 대표 필수 proxy `226490`, `229200`, `138230`, `132030`, `114260`, `114800`이 target_asof보다 stale이면 WD02로 넘기기 전에 ETF prep만 선택 복구하거나 `blocked_needs_etf_price_refresh`로 보고한다."
        - "동일 target_asof의 stock/fundamental refresh가 완료됐고 ETF prep만 누락된 경우 전체 data-refresh 체인을 중복 실행하지 않는다. `build_universe_etf_krx.py`, ETF 일별 가격 수집, `build_universe_etf_core.py`, `sync_multiasset_metadata.py`에 해당하는 표준 ETF prep만 순서대로 선택 복구한다."
      handoff_focus: "WD02가 사용할 기준일, 데이터 freshness, 주요 산출물 경로, 막힌 항목."
      expected_report:
        - "status"
        - "asof"
        - "completed_work"
        - "evidence_files"
        - "known_issues"
        - "handoff_to_next"

    WD02_MARKET_COLLECT:
      thread: "QuantMarketData"
      title: "주중 시장 데이터 수집"
      timebox_minutes: 30
      objective: "기존 직접 지시의 '시장데이터 수집 파이프라인 진행' 수준으로 market_analysis public payload, US/global environment, market context mart current, forecast calibrated current, 3축 그래프 입력 데이터, 최신 가용 Quant handoff를 갱신/확인한다. 하네스 asof는 요청/운영일이며, 데이터 기준일(data_asof)은 DB/mart/market source의 최신 가용 거래일로 확정한다. 최신 가용 데이터가 하네스 asof 전일이면 data_asof 기준으로 생성/게시하고 실행일과 데이터 기준일을 분리 보고한다. 시장분석 public payload는 로컬 생성에 그치지 말고 remote publish 가능/완료 상태까지 확인한다. research_full, full model run, 정책 변경, 자동 매매/배포는 하지 않는다."
      required_checks:
        - "하네스 asof(요청/운영일)와 data_asof(최신 가용 데이터 기준일)를 분리한다. 장 마감/데이터 적재 전이라 DB/mart가 전 거래일까지라면 그 날짜를 data_asof로 확정하고 stale로 보지 않는다."
        - "대량 수집 전에 `D:\\Quant\\venv64\\Scripts\\python.exe D:\\Quant\\scripts\\harness\\check_kiwoom_ip_auth.py --asof <data_asof> --report-path <run_dir>\\kiwoom_ip_auth_preflight.json`으로 Kiwoom 허용 IP, 토큰 발급, 단일 종목 조회를 읽기 전용 점검한다. App Key, Secret, 토큰은 보고서에 기록하지 않는다."
        - "preflight가 `blocked_needs_kiwoom_allowed_ip_update`이면 Kiwoom 전체 수집을 시작하지 않고 현재 공인 IP, 관리 URL, 차단 원인을 Harness에 보고한다. 이 상태는 mart fallback 계약을 검토하기 전에는 WD02 completed로 처리하지 않는다."
        - "D:\\QuantMarket\\service_platform\\ai_training\\market_context\\current\\market_model_input_daily_current.csv max asof_date가 data_asof와 같은지 확인한다."
        - "D:\\QuantMarket\\service_platform\\ai_training\\market_context\\current\\market_forecast_ai_calibrated_daily_current.csv max asof_date가 data_asof와 같은지 확인한다."
        - "mart 또는 forecast calibrated current가 data_asof보다 stale이면 WD03로 넘기기 전에 `run_daily_market_ai_training_update.py --profile operational --expected-asof <data_asof>` 또는 동등한 운영용 market context mart refresh 단계를 수행하고, 이후 market-analysis public payload를 재생성한다."
        - "`run_daily_market_ai_training_update.py --profile full` 또는 AI v1.1 학습/비교 단계는 WD02에서 실행하지 않는다. 운영 profile이 실패하면 `blocked_needs_operational_mart_refresh` 또는 `blocked_needs_market_context_mart_refresh`로 보고한다."
        - "daily market-context update 결과 report를 확인하고, 3축 그래프 입력 데이터가 data_asof 기준인지 evidence로 남긴다."
        - "최신 가용 Quant handoff를 생성/검증한다. same-asof handoff가 생성되지 못하면 최신 가용 asof와 실패 원인을 분리해 보고한다."
        - "market-analysis public payload 생성/갱신 시 `D:\\Quant\\venv64\\Scripts\\python.exe D:\\QuantMarket\\run_market_analysis_pipeline.py --market KR --asof <data_asof>T19:00:00+09:00 --publish-remote` 또는 동등한 publish-remote 절차를 사용한다."
        - "이미 로컬 handoff가 생성돼 있으면 `D:\\Quant\\venv64\\Scripts\\python.exe D:\\QuantMarket\\publish_market_analysis_remote.py --asof <data_asof>T19:00:00+09:00` 또는 동등한 원격 publish 절차로 remote current를 갱신한다."
        - "`validate_quantmarket_daily.py --expected-asof <data_asof> --check-remote` 또는 동등 검증으로 remote market-analysis payload asof가 data_asof인지 확인한다."
        - "mart/forecast/handoff 갱신이 실패하면 failed가 아니라 `blocked_needs_operational_mart_refresh`, `blocked_needs_market_context_mart_refresh`, `blocked_forecast_source_stale`, `blocked_quant_handoff_unavailable`처럼 원인을 명확히 보고한다."
      execution_controls:
        - "Kiwoom IP 변경 복구는 반자동으로 처리한다. Harness가 관리 페이지를 열고 현재 공인 IP 입력을 보조할 수 있지만 공동인증서 로그인과 최종 IP 등록은 사용자가 수행/승인한다. 인증서 또는 로그인 비밀번호를 `.env`, prompt, report에 저장하지 않는다."
        - "사용자가 IP 등록 완료를 확인한 뒤 preflight를 정확히 1회 재실행한다. 통과하면 마지막 안전 checkpoint부터 WD02를 재개하고, 다시 실패하면 반복 로그인/수집 없이 원인 코드와 함께 blocked로 유지한다."
        - "operational refresh 시작 전, 동일 data_asof의 daily update report, runner checkpoint, 실행 중인 process와 마지막 산출물 갱신시각을 확인한다. 이미 실행 중이거나 checkpoint가 있으면 전체 profile을 중복 시작하지 않는다."
        - "무출력만으로 중단 처리하지 않는다. 8분 이상 새 로그·산출물·checkpoint 진행이 없을 때 process/timeout 상태를 확인하고, 안전한 checkpoint가 있으면 검증된 `--start-at <last_completed_step 다음 단계>` 또는 동등 절차로 재개한다."
        - "재개 시 실행 시작 단계, 마지막 성공 단계, 재개 후 elapsed와 최종 report path를 분리 보고한다. checkpoint가 없거나 재개 안전성이 검증되지 않으면 `blocked_needs_operational_mart_refresh`로 보고한다."
      handoff_focus: "WD03 분석에 필요한 public payload/manifest, remote publish 상태, US/global environment 갱신 상태, market context mart freshness, 최신 가용 handoff 기준일, 하네스 asof와 data_asof 차이, 누락/경고."
      expected_report:
        - "status"
        - "asof"
        - "data_asof"
        - "latest_available_data_asof"
        - "source_coverage"
        - "kiwoom_preflight_status"
        - "kiwoom_public_ip"
        - "kiwoom_recovery_status"
        - "market_context_mart_status"
        - "forecast_current_status"
        - "three_axis_graph_input_status"
        - "quant_handoff_status"
        - "market_remote_publish_status"
        - "evidence_files"
        - "known_issues"
        - "handoff_to_next"

    WD03_MARKET_ANALYSIS:
      thread: "QuantMarket"
      title: "주중 시장 분석"
      timebox_minutes: 30
      objective: "기존 직접 지시의 '마켓분석 진행' 범위로 최신 가용 데이터 기준일(data_asof) 시장분석 payload 생성, QuantService handoff 검증, 시장 브리핑 3축 그래프 값 반영 확인, GCS 게시 증거와 live current coherence 확인까지 수행한다. 하네스 asof는 요청/운영일이며, publish_asof는 웹 게시 기준시각, data_asof는 mart/forecast 실제 최신 기준일로 분리한다. 과거 종가 target보다 live current가 앞서 있으면 current를 과거로 롤백하지 않고 immutable history를 검증하며, live current는 별도 coherence 검사만 수행한다. DB/mart가 전 거래일까지 있으면 data_asof 기준 분석으로 처리한다. 자동매매, 정책 변경, full rebuild, research_full은 하지 않는다."
      required_checks:
        - "WD01_QUANT_FRONT 완료 보고를 확인한다."
        - "WD02_MARKET_COLLECT 완료 보고를 확인한다. WD02가 blocked이면 WD03를 정상 completed로 처리하지 않는다."
        - "WD02 보고서의 data_asof/latest_available_data_asof를 확인하고, WD03 분석 기준일로 사용한다. 하네스 asof와 data_asof가 달라도 최신 가용 거래일이면 stale로 보지 않는다."
        - "publish_asof와 data_asof를 분리 보고한다. publish_asof는 `quantservice_market_manifest.json`/GCS current의 게시 기준시각이고, data_asof는 mart/forecast 실제 기준일이다."
        - "WD02 보고서의 market_context_mart_status를 먼저 확인한다."
        - "WD02 보고서의 forecast_current_status, three_axis_graph_input_status, quant_handoff_status를 먼저 확인한다."
        - "WD02 보고서의 market_remote_publish_status를 먼저 확인한다."
        - "WD03 시작 시 target asof, remote current publish_asof, data_asof를 비교해 `validation_mode=current|history`를 먼저 결정한다. target보다 live current가 최신이면 반드시 history 모드를 사용한다."
        - "과거 target 검증에서는 live current를 과거일로 재게시하거나 롤백하지 않는다. `validate_quantmarket_daily.py --expected-asof <target_asof> --validation-mode history --check-remote --remote-publish-report <target remote publish report>` 또는 동등한 immutable history 검증을 사용한다."
        - "과거 target의 remote history가 없을 때만 `run_market_analysis_pipeline.py --asof <target timestamp> --publish-remote --remote-history-only` 또는 동등한 history-only 게시를 허용한다. current overwrite는 금지한다."
        - "live current는 target history 검증과 별도로 `validate_quantmarket_daily.py --expected-asof <data_asof> --validation-mode current --check-remote` 또는 동등한 cache-bust coherence 검사로 api_v1_*와 quantservice_* endpoint family의 asof와 3축 값 일관성을 확인한다."
        - "WD02가 같은 target/data_asof의 remote publish report와 history evidence를 이미 생성했다면 WD03에서 동일 payload를 다시 current publish하지 말고 해당 evidence를 재사용한다."
        - "D:\\QuantMarket\\service_platform\\ai_training\\market_context\\current\\market_model_input_daily_current.csv max asof_date가 data_asof와 같은지 확인한다."
        - "D:\\QuantMarket\\service_platform\\ai_training\\market_context\\current\\market_forecast_ai_calibrated_daily_current.csv max asof_date가 data_asof와 같은지 확인한다."
        - "위 파일이 data_asof보다 stale이면 기존 직접 지시 범위에 맞게 market context/model input mart 갱신을 진행하거나, 진행 불가 시 `blocked_needs_market_context_mart_refresh` 또는 `blocked_forecast_source_stale`로 보고한다."
        - "data_asof 기준 market_analysis public payload를 생성한다."
        - "QuantService handoff와 quantservice_market_manifest.json을 검증한다. live current가 target보다 최신이면 current를 target으로 덮지 말고, target history와 최신 current coherence를 분리 확인한다."
        - "api_v1_market_analysis_detail.json의 market_state_composite 3축 chart series가 data_asof mart를 반영하는지 확인한다."
        - "GCS 게시 증거를 필수 확인한다. 동일 target이 WD02에서 게시됐으면 그 remote publish report/history를 재사용하고, 미게시 target만 current 또는 history-only 방식으로 한 번 게시한다."
        - "GCS history 검증 실패, live current endpoint coherence 실패, handoff 기준일 불일치, stale mart가 있으면 completed가 아니라 blocked 또는 failed로 보고한다."
      handoff_focus: "WD04가 사용할 data_asof 시장분석 payload, QuantService handoff current, 3축 그래프 freshness, GCS remote publish evidence, current manifest, 하네스 asof와 data_asof 차이, known_issues."
      expected_report:
        - "status"
        - "asof"
        - "publish_asof"
        - "data_asof"
        - "latest_available_data_asof"
        - "validated_target_asof"
        - "validation_mode"
        - "market_context_status"
        - "market_context_mart_status"
        - "forecast_current_status"
        - "three_axis_graph_input_status"
        - "quantservice_handoff_status"
        - "market_analysis_payload_status"
        - "market_remote_publish_status"
        - "remote_current_manifest_status"
        - "evidence_files"
        - "known_issues"
        - "handoff_to_next"

    WD04_QUANT_REAR:
      thread: "Quant"
      title: "주중 Quant 후반부 업데이트"
      timebox_minutes: 30
      objective: "WD03가 정리한 기존 market context/handoff를 기준으로 평소 직접 지시 수준의 주중 후반부 current 산출과 필수 검증을 수행/확인한다. Quant user/model snapshot 화면에 필요한 user report, user-facing current snapshot, history payload가 target asof로 갱신됐는지 확인한다. 동시에 하네스의 Model Performance Governance 입력으로 전략 모델/AI 학습 모델의 성능 점검 요약을 남기되, research_full, 장기 백테스트, 정책 변경, 자동 publish 확정은 하지 않는다."
      required_checks:
        - "WD04의 표준 직접 지시 범위는 `run_daily_quant_pipeline.py --asof <target_asof> --include-etf --model-run-only --pipeline-mode daily_light --skip-remote-current-publish` 또는 동등한 단일 후반부 체인이다. 이 정상 실행에는 최대 30분을 허용하고 10분 제한을 적용하지 않는다."
        - "동일 target_asof의 전략 모델 산출이 이미 생성된 상태에서 후처리만 누락됐으면 장시간 모델 명령을 재실행하지 않는다. timing report의 마지막 성공 command 이후 admin tracker, internal/AI governance current, trading-sign, contract validation만 선택 복구한다."
        - "모델 실행 전에 `D:\\Quant\\config\\harness\\model_scope_registry.yaml`, `internal_model_validation_current.json`, `ai_learning_models_current.json`을 확인해 model_scope_gate를 먼저 적용한다."
        - "이번 WD04의 운영 모델 범위는 Quant 1.0뿐이다. Quant 1.1/2.x research, shadow, handoff, payload, validation, promotion, publish는 별도 사용자 지시 없이는 확인 또는 실행 대상에 포함하지 않는다. `model_version_scope_status: quant_1_0_only`로 보고한다."
        - "현재 `operating_scope_contract`가 `legacy_static/inactive`인 동안에는 위 Quant 1.0 범위를 그대로 유지한다. selection freeze/readiness/candidate 산출물은 운영 scope 권한이 아니며, `manifest_activation_eligible=false`이면 절대 운영 입력으로 승격하지 않는다."
        - "S2, S3, S3_CORE2, S3_ACCEL_V01, S4, S5, S6 후보는 2026-08-22 동결 이후 최소 180 calendar days의 live shadow와 주간 26회 또는 월간 6회 결정, 사전 정의된 수익/MDD/변동성/turnover gate 통과 전에는 운영 scope 대상이 아니다. 가장 빠른 검토일은 2027-02-18이며 데이터나 결정 수가 부족하면 연장한다."
        - "향후 Quant OS 활성화 뒤에는 전역 버전 문자열이 아니라 하네스 prompt에 resolve된 `operating_scope_source`, 정확한 `model_code`, `operating_revision`만 실행 권위로 사용한다. 보고서에 모델별 revision과 manifest status를 남긴다."
        - "`S2_PIT_V01`, `I-STOCK-STRONG-RSI-V01`, AI `research_archive_excluded_from_default`, `excluded_from_default` 모델은 기본 WD04 실행 범위에 포함하지 않는다."
        - "REVIEW 상태 모델은 자동 제외하지 말고 `downgrade_or_redesign_candidate` 또는 known_issues로만 보고한다. 모델 상태 변경은 Quant Model 스레드에서만 결정한다."
        - "AI governance payload의 target asof와 underlying model evidence date를 분리한다. governance payload/admin current가 target asof이고 운영 계약이 통과하면 오래된 underlying evidence는 known_issues/refresh_needed로 보고하되 일률적으로 WD04를 차단하지 않는다. 운영 계약이 same-asof evidence를 요구하거나 stale AI를 실제 현재 의사결정에 사용했다면 `blocked_needs_ai_core_freshness_decision`으로 보고한다."
        - "전략 모델별 성능 점검 결과를 `keep`, `improve`, `review`, `downgrade_candidate`, `retire_candidate` 후보 중 하나로 요약하되, 상태 변경은 확정하지 않는다."
        - "성과 우수 모델은 `high_performance_models_to_expand`에 확장/개선 실험 후보로 보고하고, 성과 저하 모델은 `low_performance_models_to_reduce_or_archive`에 강등/정리 후보로 보고한다."
        - "AI 학습 모델별 freshness와 성과 기여도를 확인해 `ai_models_to_refresh_or_downgrade`에 refresh/observation/archive 후보를 분리 보고한다."
        - "신규 모델 개발 후보는 `new_model_research_candidates`에 기존 운영 모델 대비 기대 수익률 개선 가설과 함께 보고한다."
