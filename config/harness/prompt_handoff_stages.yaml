        - "daily_light 또는 동등한 직접 지시 수준 절차에서 stable/balanced/growth `redbot_user_report_<profile>_<target_asof>.json`이 생성됐는지 확인한다."
        - "`D:\\Quant\\service_platform\\web\\public_data\\current\\user_model_snapshot_report.json` 및 관련 user-facing current payload가 target asof인지 확인한다."
        - "`D:\\Quant\\service_platform\\web\\public_data\\history\\user_model_holdings_history.json`와 `user_model_performance_history.json`이 target asof인지 확인한다."
