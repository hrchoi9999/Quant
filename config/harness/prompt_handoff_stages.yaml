        - "완료 전 `admin_new_entry_tracker`, `internal_model_validation_current.json`, `ai_learning_models_current.json`, trading-sign current를 target asof로 생성/검증하고 `validate_daily_pipeline_contract.py --asof <target_asof>`와 `validate_trading_sign_snapshots.py --asof <target_asof>`를 통과해야 한다."
