        - "후보 성과는 절대수익률과 지수 대비 성과를 분리해 보고한다. 하락장 방어로 지수 대비 양호하더라도 절대수익률이 약하면 개선 후보로 남긴다."
        - "top10 후보와 top3 후보의 평균/중앙값 수익률, 승률, 지수 대비 성과를 요약하고, sample이 부족하거나 history rows가 비어 있으면 completed로 숨기지 말고 known_issues에 남긴다."
        - "top3와 rank4~10 성과를 분리해 `top3_return_avg`, `rank4_10_return_avg`, `top3_vs_rank4_10_gap`, `top3_win_rate`, `benchmark_relative_median`을 보고한다."
