    WE01_QUANT_WEEKEND_PIPELINE:
      thread: "Quant"
      title: "주말 Quant 모델/AI 검증 통합 파이프라인"
      timebox_minutes: 120
      objective: "Quant 모델 스레드 안에서 평소 직접 지시 수준의 주말 모델/AI 검증 통합 파이프라인을 한 번에 수행한다. DB/schema/freshness, 사용 가능한 market handoff, 기존 연구 산출물, research_full/research_validation, AI 검증 결과, 정책 후보/보류 의견을 한 보고서로 정리한다. 이 단계는 하네스 Model Performance Governance의 핵심 점검 단계로서 성과 우수 모델의 발전 방향, 성과 저하 모델의 정리 후보, 신규 모델 개발 후보를 반드시 포함하되, full rebuild, 전체 히스토리 재산출, 정책 변경 확정, 자동 publish는 하지 않는다."
      required_checks:
        - "주말 파이프라인 실행 전에 `D:\\Quant\\config\\harness\\model_scope_registry.yaml`, `internal_model_validation_current.json`, `ai_learning_models_current.json`을 확인해 model_scope_gate를 먼저 적용한다."
        - "이번 WE01의 운영 실행 및 운영 성능 거버넌스 범위는 Quant 1.0뿐이다. 단, Quant 1.2 frozen live-shadow의 Quant 1.0 baseline 대비 읽기 전용 성능 비교는 별도 병렬 governance 항목으로 포함한다. Quant 1.1/2.x의 신규 연구, 재설계, promotion, operating payload, publish는 별도 사용자 지시 없이는 실행하지 않는다. `model_version_scope_status: quant_1_0_only_with_quant_1_2_shadow_observation`으로 보고한다."
        - "현재 `operating_scope_contract`가 `legacy_static/inactive`인 동안에는 위 Quant 1.0 범위를 그대로 유지한다. Quant 1.2 selection freeze/readiness는 읽기 전용 연구 evidence일 뿐 WE01 운영 scope 또는 프로세스 소유권을 부여하지 않는다."
        - "Quant 1.2의 7개 채택 후보는 2026-08-22 이후 180일 live shadow, 주간 26회·월간 6회 결정, 모델별 수익/MDD/변동성/turnover risk gate가 모두 통과하고 사용자 최종 승인이 있어야만 별도 활성화 검토가 가능하다. 가장 빠른 검토 가능일은 2027-02-18이다. 운영 실행/publish 범위에는 포함하지 않지만 기존 frozen shadow의 비교 보고는 WE01에 포함한다."
        - "Quant 1.2 후보는 frozen/immutable이다. 모델 출력에 영향을 주는 로직, 파라미터, 유니버스 선택 규칙, 점수화, 리밸런싱, 위험 규칙을 Quant 1.2 이름으로 변경하지 않는다. 이런 변경안은 기존 1.2 shadow를 수정하거나 초기화하지 말고 별도 Quant 1.3 후보 연구로 분리한다."
        - "Quant 1.2 shadow에서는 정기 입력 데이터 갱신, 동일 코드 재현 실행, 성능 기록, 모니터링/하네스의 비의미적 수정만 허용한다. 최신 readiness의 `candidate_immutable_fingerprint_matches`가 false이면 해당 모델 비교를 `blocked_quant_1_2_immutable_fingerprint_mismatch`로 무효화하고 Quant 1.0 운영 파이프라인과 분리 보고한다."
        - "`config/quant1_2/operational_readiness_requirements.json`, 최신 `readiness_report.json`, 모델별 `forward_shadow/<model>/observations.json`과 `risk_evaluation.json`을 읽어 Quant 1.0 baseline, Quant 1.2 candidate, candidate-minus-baseline 수익률/MDD/변동성/turnover를 분리 보고한다."
        - "live metric이 아직 없으면 0으로 기록하거나 과거 연구 백테스트로 대체하지 말고 `waiting_live_metrics`로 보고한다. calendar days와 주간 26회·월간 6회 decision 진행률은 별도로 표시한다."
