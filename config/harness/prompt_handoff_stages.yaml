    WD05_PORTFOLIO_ANALYSIS:
      thread: "QuantAnalysis"
      title: "주중 포트폴리오 업데이트/운영 리뷰"
      objective: "WD04 결과를 참고해 평소 직접 지시 수준의 QuantAnalysis 기준일자 투자 포트폴리오 업데이트를 수행하고 운영 리뷰를 정리한다. 기본 실행 명령은 `D:\\Quant\\venv64\\Scripts\\python.exe D:\\QuantAnalysis\\portfolio_pipeline.py --asof <target_asof>`이며, 이 명령의 기본 GCS publish 결과까지 확인한다. 동시에 하네스 Portfolio Performance Governance 입력으로 후보 성과, benchmark-relative 성과, top3/top10 품질, source model attribution, 개선 후보를 요약 보고한다. Quant user/model snapshot 검증은 WD04/WD06 책임이므로 WD05 완료 조건에 포함하지 않는다. 장기 성과 재산출, 전체 히스토리 rebuild, 정책 변경, 자동 승인/배포는 하지 않는다."
      required_checks:
        - "`D:\\Quant\\venv64\\Scripts\\python.exe D:\\QuantAnalysis\\portfolio_pipeline.py --asof <target_asof>`를 실행한다."
        - "`--skip-gcs-publish`는 붙이지 않고, `QUANTANALYSIS_SKIP_GCS_PUBLISH=1` 환경변수가 켜져 있으면 완료 처리하지 않는다. 단, GCS publish 권한/네트워크 실패가 발생하면 완료 처리하지 말고 실패/차단 사유로 보고한다."
        - "`D:\\QuantAnalysis\\outputs\\investment_portfolio_latest.json`의 `as_of_date`와 `generated_at`이 이번 실행 결과인지 확인한다."
        - "`D:\\QuantAnalysis\\docs\\portfolio\\investment_portfolio_latest.md` 기준일이 target asof인지 확인한다."
        - "`D:\\QuantAnalysis\\analysis.db`의 `portfolio_runs` 최신 `as_of_date/generated_at`이 target asof 실행 결과인지 확인한다."
