        - "stock/ETF/cash 비중, top10 중 top3 우선 편입 방식, relative_to_index 필터, drawdown/turnover 추가 산출, REVIEW 모델 후보 감산 같은 개선 후보를 `improvement_candidates_for_validation`으로 보고한다."
        - "포트폴리오 정책 변경, 실제 비중 변경, 모델 제외/승격/폐기는 확정하지 말고 주말 WE01 또는 별도 QuantAnalysis/Quant Model 검증 후보로 넘긴다."
        - "GCS current `gs://quantservice-489808-market-analysis/admin/current/investment_portfolio_latest.json` 또는 공개 URL을 cache-buster로 재조회해 로컬 `as_of_date/generated_at`과 일치하는지 확인한다."
